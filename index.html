<title>Finance Lab – Fee Payment</title>

<style>
:root{--navy:#164a6e;--navy2:#0e3550;--green:#4caf50;--ink:#14243b;--muted:#5d6b7e;--line:#cfdbe6;--err:#b3261e;--ok:#1f6b45}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:22px 16px 40px;position:relative;overflow-x:hidden;
  background:linear-gradient(180deg,#164a6e 0,#2d78a8 260px,#e9f2f9 520px,#fff 100%) fixed}
/* big "Finance Lab" background text */
body::before{content:"Finance Lab";position:fixed;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-24deg);
  font:800 clamp(70px,20vw,190px)/1 Georgia,serif;color:#164a6e;opacity:.07;white-space:nowrap;pointer-events:none;z-index:0}
main{width:100%;max-width:470px;position:relative;z-index:1}
.logo{background:#fff;border-radius:16px;padding:10px 14px;display:flex;justify-content:center;box-shadow:0 6px 20px rgba(14,53,80,.25);margin-bottom:16px}
.logo img{height:120px;width:auto;display:block}
h1{font:700 27px/1.2 Georgia,serif;margin:0 0 4px;color:#fff;text-align:center}
.sub{color:#dbe9f4;margin:0 0 18px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(14,53,80,.12)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}.f{margin-bottom:16px}
input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px;min-height:46px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #7cc4f0;border-color:var(--navy)}
.err{color:var(--err);font-size:13px;min-height:18px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:600 17px system-ui,sans-serif;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:15px;cursor:pointer}
.btn:hover{background:var(--navy2)}.btn.green{background:#2e7d32}.btn.green:hover{background:#25682a}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy);margin-top:10px}
.btn:disabled{opacity:.6}
.muted{color:var(--muted);font-size:13px}.ok{color:var(--ok);font-weight:600}
#panel,#step2{display:none}
.qrbox{text-align:center}.qrbox img{width:230px;height:230px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.amt{font:700 26px Georgia,serif;color:var(--navy);margin:6px 0 2px}
.demo{background:#fff6e0;border:1px solid #e8c36a;color:#6b4e00;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}

<h1>Finance Lab</h1><p class="sub">Course fee payment</p>

<div class="card">
  <div class="demo" id="demo">Preview mode: the server isn’t connected, so payments can’t be saved yet. Deploy on Netlify to save records.</div>
  <div class="f"><label for="name">Student name</label><input id="name" autocomplete="name"><div class="err" id="e-name"></div></div>
  <div class="f"><label for="cls">Class</label><input id="cls"><div class="err" id="e-cls"></div></div>
  <div class="f"><label for="course">Course</label><select id="course"></select><div class="err" id="e-course"></div></div>
  <div class="f"><label for="amount">Amount (₹)</label><input id="amount" type="number" min="1" inputmode="numeric" readonly><div class="err" id="e-amount"></div></div>
  <button class="btn" id="pay" type="button">Pay now</button>
</div>

<div class="card" id="panel">
  <div class="qrbox">
    <div class="muted">Scan with any UPI app</div>
    <div class="amt" id="pamt"></div>
    <img id="qr" alt="UPI payment QR code">
    <a class="btn green" id="openapp" href="#" style="margin-top:14px">Open payment app</a>
    <p class="muted">On a phone, tap the button. On a computer, scan the QR with your phone.</p>
  </div>
</div>

<div class="card" id="step2">
  <div class="f"><label for="utr">After paying, enter the Transaction ID (UTR)</label>
    <input id="utr" inputmode="numeric" maxlength="12" placeholder="12-digit number from your payment app">
    <div class="err" id="e-utr"></div></div>
  <button class="btn" id="send" type="button">Submit payment details</button>
  <p id="done" class="ok"></p>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
/* Used only if the server can’t be reached (e.g. file opened directly) */
let cfg={upi:"him.mayne@okhdfcbank",payee:"Himanshu Mayne",org:"Finance Lab",
  courses:[{name:"Course 1",fee:1500},{name:"Course 2",fee:1500},{name:"Course 3",fee:1500}]};
function fill(){$("course").innerHTML='<option value="">Select a course</option>'+cfg.courses.map(c=>`<option value="${c.name}">${c.name}</option>`).join("")}
fill();
fetch("/api/courses").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{cfg=d;fill()}).catch(()=>{$("demo").style.display="block"});

const cur=()=>cfg.courses.find(c=>c.name===$("course").value);
$("course").onchange=()=>{const c=cur();$("amount").value=c?c.fee:""};

function check(){
  const name=$("name").value.trim(),cls=$("cls").value.trim(),c=cur();
  $("e-name").textContent=name?"":"Enter the student’s name.";
  $("e-cls").textContent=cls?"":"Enter the class.";
  $("e-course").textContent=c?"":"Select a course.";
  return name&&cls&&c?{name,cls,c,amt:c.fee}:null;
}
$("pay").onclick=()=>{
  const v=check(); if(!v) return;
  const safe=t=>String(t).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const note=safe(v.c.name+" fee "+v.name+" "+v.cls).slice(0,60);
  const link="upi://pay?pa="+cfg.upi+"&pn="+cfg.payee.replace(/\s+/g,"")+"&am="+v.amt.toFixed(2)+"&cu=INR&tn="+note;   // no %-encoding: some UPI apps show it literally
  const qr=qrcode(0,"M");qr.addData(link);qr.make();$("qr").src=qr.createDataURL(6,4);
  $("pamt").textContent="₹"+v.amt.toLocaleString("en-IN");
  $("openapp").href=link;$("panel").style.display="block";$("step2").style.display="block";
  if(/Android|iPhone|iPad/i.test(navigator.userAgent)) $("openapp").click();   // phones: open the payment app directly
  setTimeout(()=>$("panel").scrollIntoView({behavior:"smooth"}),300);
};
$("send").onclick=async()=>{
  const v=check(); if(!v) return;
  const utr=$("utr").value.replace(/\s/g,"");
  $("e-utr").textContent=/^\d{12}$/.test(utr)?"":"The UTR is a 12-digit number.";
  if(!/^\d{12}$/.test(utr)) return;
  $("send").disabled=true;
  try{
    const r=await fetch("/api/submit",{method:"POST",body:JSON.stringify({name:v.name,cls:v.cls,course:v.c.name,amount:v.amt,utr})});
    const d=await r.json();
    if(r.ok){$("done").textContent="Thank you! Your payment is recorded and will be verified shortly.";$("send").style.display="none"}
    else{$("e-utr").textContent=d.error||"Something went wrong. Try again."}
  }catch(e){$("e-utr").textContent="Can’t reach the server. This page must be deployed on Netlify to save payments."}
  $("send").disabled=false;
};
</script></body></html>
